name: build-xnu-8796

# Parallel line to build-kernel.yml (xnu-10063). This one targets the xnu generation
# that actually matches an iPadOS 16.6.1 userland: xnu-8796.141.3 (macOS 13.5).
#
# Hard constraints, learned from the reference project (mytiantian001/iPadOS-cepheus,
# see docs/prior-art-mytiantian001-ipados-cepheus.md):
#   * Xcode 16's iig emits IORPC.kernelContent, which xnu-8796 does not have ->
#     the runner must stay on macos-14 with its oldest Xcode 15.
#   * libfirehose_kernel is built arm64e-only; the CEPHEUS kernel is plain arm64,
#     so build.sh has to be told to build arm64 as well.
#   * MACHINE_CONFIG=CEPHEUS selects the MASTER.arm64.cepheus config that patch 0006 adds.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu-8796/patches/**"
      - ".github/workflows/build-kernel-8796.yml"

concurrency:
  group: xnu8796-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"          # -> xnu-8796.141.3
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: CEPHEUS

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    # The repository default is read-only ("Contents: read"). The release step
    # needs contents:write to create the k8796-<run_id> release; without this
    # the token is read-only and the GitHub API answers 403
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # patches and their staging scripts go next to blacktop's
          cp xnu-8796/patches/*.patch xnu-8796/patches/*.sh dxb/patches/
          # the patch set was staged from a Windows checkout: patch(1) rejects CRLF
          for f in dxb/patches/*.patch dxb/patches/*.sh; do
            perl -pi -e 's/\r$//' "$f"
          done
          grep -lc $'\r' dxb/patches/*.patch 2>/dev/null | head -3 || echo "no CRLF left"
          # libfirehose_kernel is arm64e-only; the CEPHEUS kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches | head -5
          ls dxb/patches | wc -l

      - name: Toolchain (Xcode 15 only)
        run: |
          brew install jq gum bash cmake ninja || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | head -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1); fi
          echo "picked: $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          bash build.sh 2>&1 | tee build.log
          echo "=== exit: $? ==="
          grep -c ' error: ' build.log || true

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out || true
          # kernel.development.cepheus.link is a directory, so a bare `kernel.*`
          # glob made shasum fail; only checksum the kernel files themselves.
          # Write the list with bare file names (run from inside out/) so
          # `sha256sum -c SHA256SUMS` works both in the extracted zip and next to
          # the loose release assets.
          (cd out && shasum -a 256 kernel.*.cepheus > SHA256SUMS) \
            || rm -f out/SHA256SUMS
          cat out/SHA256SUMS || true

      - name: Package payload (ADT + 64 MiB cust image)
        # Until now the 8796 line published a bare kernel. What DarwinBoot
        # actually consumes is the cust payload, and every piece of it is
        # already pinned in this repo:
        #   scripts/make-cepheus-adt.py            platform DT, /cepheus-fbcon,
        #                                          /cepheus-ufs, rd=ufsroot0
        #   scripts/make-cepheus-cust-payload.sh   FAT16 volume + unixnu.toml +
        #                                          RAMDisk placeholder
        # Values mirror board.toml [payload.adt]; root-matching is deliberately
        # omitted because this kernel boots the raw UFS window (patch 0028)
        # instead of an IOMedia volume.
        #
        # Identity: patches 0059/0061 target the iPhone X userland (hw.machine
        # iPhone10,3, hw.model D22AP, 1125x2436 logical panel), so the ADT must
        # carry the matching root DT instead of the iPad identity used by the
        # 10063 line.
        if: always() && hashFiles('out/kernel.*.cepheus') != ''
        run: |
          # make-cepheus-cust-payload.sh needs mcopy/mdir and mkfs.vfat; brew
          # sometimes exits 1 after pouring bottles, so judge by the binaries.
          brew install mtools dosfstools || brew install mtools dosfstools
          command -v mcopy
          command -v mkfs.vfat
          K=$(ls out/kernel.*.cepheus | head -1)
          echo "kernel: $K"
          python3 scripts/make-cepheus-adt.py \
            --output out/kernel.macho.adt \
            --dram-size 0x180000000 \
            --owned-memory-size 0x20000000 \
            --cpu-regs 0,0x100,0x200,0x300,0x400,0x500,0x600,0x700 \
            --iphone-identity
          python3 - <<'PY'
          import struct
          b = open('out/kernel.macho.adt', 'rb').read()
          nprop, nchild = struct.unpack_from('<II', b, 0)
          props = {}
          off = 8
          for _ in range(nprop):
              key, length = struct.unpack_from('<32sI', b, off)
              off += 36
              props[key.rstrip(b'\0').decode()] = b[off:off + length].split(b'\0')[0].decode()
              off += length + (-length % 4)
          print('ADT root:', props.get('model'), '/', props.get('compatible'))
          assert props.get('model') == 'iPhone10,3', props.get('model')
          assert props.get('compatible') == 'D22AP', props.get('compatible')
          PY
          bash scripts/make-cepheus-cust-payload.sh \
            "$K" out/kernel.macho.adt out/cust-payload.img
          (cd out && shasum -a 256 cust-payload.img kernel.macho.adt >> SHA256SUMS)
          cat out/SHA256SUMS
          ls -lh out

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-8796-kernel
          path: |
            out/
            dxb/build.log
          if-no-files-found: warn

      - name: Package build product (same layout as the Actions artifact)
        # The public release should carry the build product itself, not only the
        # pieces the artifact happens to be made of. Mirror the Upload step's
        # path list (least common ancestor = workspace root), so extracting
        # xnu-8796-kernel.zip yields out/... and dxb/build.log exactly like the
        # Actions artifact named xnu-8796-kernel.
        if: always() && hashFiles('out/kernel.*.cepheus') != ''
        run: |
          rm -f xnu-8796-kernel.zip
          zip -qr xnu-8796-kernel.zip out dxb/build.log
          unzip -l xnu-8796-kernel.zip | tail -3
          ls -lh xnu-8796-kernel.zip

      - name: Publish kernel to release (public direct download)
        # Only publish when the kernel actually exists: `always()` alone would
        # try to create a release for a failed build, and agh-release then
        # errors on the missing file.
        if: always() && hashFiles('out/kernel.*.cepheus') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k8796-${{ github.run_id }}
          name: xnu-8796 ${{ github.sha }}
          body: |
            Automated xnu-8796 build (${{ github.sha }})
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            `xnu-8796-kernel.zip` is the build product, with the same layout as
            the Actions artifact of that name (`out/` + `dxb/build.log`):

                unzip xnu-8796-kernel.zip
                cd out && shasum -a 256 -c SHA256SUMS

            `cust-payload.img` is the 64 MiB FAT16 cust image built by
            `scripts/make-cepheus-cust-payload.sh` (kernel + `kernel.macho.adt`
            + empty ramdisk + `unixnu.toml` boot args, root on `ufsroot0`):

                fastboot flash cust cust-payload.img

            Booting it still needs the UEFI/DarwinBoot boot shim. The kernel,
            ADT and cust image are also attached loose for direct download.
          files: |
            xnu-8796-kernel.zip
            out/kernel.*.cepheus
            out/kernel.macho.adt
            out/cust-payload.img
            out/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
