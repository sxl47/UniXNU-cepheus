name: build-xnu-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
      GH_TOKEN: ${{ secrets.GH_PAT }}
      # NativeUfs.cpp does not compile in this tree (three errors the archive log truncates away).
      # Build the read-only register probe in its place so the kernel links and reports what the
      # GCC and UFSHCI windows actually read.
      XNU_NABU_UFS_REGISTER_PROBE: "1"
      # Xcode 26.6's MacOSX26.5.sdk dropped usr/include/compat/hostcompat.h, so the Linux
      # host-compat shim injected by Lux12138's linux-host-tools.patch
      # (HOST_COMPAT_CFLAGS ?= -include .../compat/hostcompat.h) fails to compile SETUP tools.
      # On macOS getprogname/strlcpy/strlcat are native libSystem calls, so the shim is not
      # needed; the makefile uses ?=, so defining these in the environment overrides it.
      HOST_COMPAT_CFLAGS: ""
      HOST_COMPAT_LIBS: ""
      # Lux12138's fork recently added a NativeDwc3 (USB) bring-up series and flipped
      # the XNU_NATIVE_DWC3 gate default to 1, making the baseline script require
      # build/native-dwc3/libNativeDwc3.a. cepheus bring-up does not need USB yet;
      # pin the gate to 0 to restore the previous behaviour while still tracking
      # the fork's other fixes (panic restart, header fixes).
      XNU_NATIVE_DWC3: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available:
          # newer iig emits IORPC.kernelContent / different reply-size metadata, and
          # mig_init() then trips "kroutine must have precise size" or overflows the
          # dispatch table. That is exactly where the boot was dying.
          # Upstream pins Xcode 26.6 on macos-26. Taking the oldest image instead gave the MIG
          # step an Xcode whose clang rejects -mach_msg2.
          XC=/Applications/Xcode_26.6.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode 16 found"
          fi
          xcodebuild -version
          xcrun --find clang
      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          # Upstream UniXNU was tried and rejected: its newer MIG path passes -mach_msg2 to
          # clang, and xnu-10063 needs the oldest iig behaviour or the reply-size metadata is
          # wrong and mig_init() trips. This snapshot is the tree the kernel actually builds on.
          git clone --recurse-submodules --depth 1 --shallow-submodules https://github.com/Lux12138/UniXNU.git UniXNU

      - name: Patch userdata.py platform detection
        # userdata.py does HOST = sys.platform, which is 'darwin' (lowercase) on macOS, but every
        # branch tests HOST == 'Darwin'. All the documented hdiutil paths (imageinfo, attach
        # -nomount, rdisk read) were therefore dead on macOS and the build fell through to the
        # Linux 7z path -- where the runner's 7z cannot see the APFS member inside the UDIF dmg
        # ("7z reported no APFS member"). capitalize() turns 'darwin' into 'Darwin' and 'linux'
        # into 'Linux', which restores the intended host selection on both platforms.
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. userdata.py: HOST = sys.platform is 'darwin' (lowercase) on macOS, but every
          #    branch tests HOST == 'Darwin'. All the documented hdiutil paths were dead on
          #    macOS and the build fell through to the Linux 7z path.
          p = Path('UniXNU/scripts/unixnu/userdata.py')
          s = p.read_text()
          assert "HOST = sys.platform" in s, "userdata.py HOST line not found"
          s = s.replace(
              "HOST = sys.platform",
              "HOST = sys.platform.capitalize()  # 'darwin'->'Darwin': engage the hdiutil paths on macOS",
              1,
          )
          p.write_text(s)
          print("patched:", p)

          # 2. udif.py: hardcodes '/usr/bin/lzfse', which lives under SIP on macOS. Route it
          #    through LZFSE_BIN so the brew-installed decoder can be selected from PATH.
          p = Path('UniXNU/scripts/unixnu/udif.py')
          s = p.read_text()
          assert "'/usr/bin/lzfse'" in s, "udif.py lzfse path not found"
          if "import os" not in s:
              s = s.replace("import struct\nimport subprocess",
                            "import os\nimport struct\nimport subprocess", 1)
          s = s.replace(
              "'/usr/bin/lzfse'",
              "os.environ.get('LZFSE_BIN', '/usr/bin/lzfse')",
              1,
          )
          p.write_text(s)
          print("patched:", p)
          PY
          grep -n "HOST = sys.platform" UniXNU/scripts/unixnu/userdata.py
          grep -n "LZFSE_BIN" UniXNU/scripts/unixnu/udif.py

      - name: Patch userdata.py Darwin path to hdiutil attach
        # Round 18 showed the fork's macOS path was never executed by its author
        # (the HOST bug made it dead code): image_size() uses hdiutil imageinfo
        # 'Total Bytes' (the whole virtual disk) while attach() unpacked only the
        # Apple_APFS partition, so the read loop hit EOF a few MB early. Round 19
        # tried hdiutil convert UDRW instead, but UDRW output is still a UDIF
        # container and hdiutil picked the SOURCE file name as its output
        # ("convert failed - File exists").
        # The fork's own Darwin design is actually correct: attach() should
        # return the whole-disk /dev/diskN from 'hdiutil attach -nomount
        # -readonly'; build() then reads /dev/rdiskN directly, and Total Bytes
        # equals the device size by construction. Override attach() accordingly;
        # leave image_size on the fork's hdiutil imageinfo implementation.
        run: |
          cat >> UniXNU/scripts/unixnu/userdata.py <<'EOF'

          # --- sxl47/cepheus CI patch: hdiutil attach device path on macOS ---
          if HOST == 'Darwin':
              import re as _re

              def attach(dmg):
                  """Attach read-only without mounting; return the whole-disk device.

                  build() opens /dev/rdiskN and reads exactly hdiutil imageinfo
                  'Total Bytes' bytes, which is the virtual disk size this device
                  exposes -- no intermediate file, no size mismatch.
                  """
                  if not is_udif(dmg):
                      return str(dmg)
                  proc = subprocess.run(
                      ['hdiutil', 'attach', '-nomount', '-readonly', '-noverify',
                       '-noautofsck', str(dmg)],
                      capture_output=True, text=True, check=True)
                  for line in proc.stdout.splitlines():
                      m = _re.match(r'(/dev/disk\d+)\s', line)
                      if m:
                          return m.group(1)
                  raise Error(f'hdiutil attach produced no whole-disk device for {dmg}')
          # --- end sxl47/cepheus CI patch ---
          EOF
          tail -30 UniXNU/scripts/unixnu/userdata.py

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig cepheus_defconfig -D "$GITHUB_WORKSPACE"

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      # `unixnu ipsw fetch` never downloads the whole ~8GB IPSW: it reads the zip
      # directory and the needed members (OS dmg volumes, kernelcache) over HTTP
      # range requests, caching them under out/ipsw/<build>/. The range-request
      # round-trips are what make this step slow; caching the extracted members
      # turns it into a no-op when the pinned IPSW has not changed.
      # Bump the key whenever board.toml [ipsw] pins change. Repo cache budget is
      # 10GB total: this entry (a few GB of dmg volumes) and the object cache are
      # both touched every run, so LRU should keep both warm.
      - name: Restore IPSW member cache
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-ipados-17.7.11-21H461
          restore-keys: |
            ipsw-

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      # Stage 6 (storage and root): the "failed to mount root device" panic from
      # device round 4 is expected -- the userdata partition still holds Android
      # ext4/f2fs, so no IOMedia carries the OS volume UUID that
      # /chosen/root-matching selects. This step packs the unchanged OS and
      # Cryptex1,SystemOS disk images from the cached IPSW behind a SHNGROOT
      # manifest, exactly as docs/guide/userdata.md prescribes. It lives at the
      # END of the job (see below) so it can never block the kernel chain:
      # round 16 let a userdata failure skip "Build kernel" entirely.

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Inject macOS iig compat patch
        # History of this patch (three CI rounds):
        # v1: hand-wrote one-arg forwarder declarations -> ambiguous overloads.
        # v2: re-signed the fork's definitions to two args -> compile passed, but
        #     the link then failed with 3 duplicate symbols: Xcode 26.6's iig
        #     (DriverKit-440) now compiles IOService.iig.cpo / IOUserClient.iig.cpo
        #     into the kernel, and those objects ALREADY DEFINE
        #     IOService::UserSetProperties(OSObject*, OSDispatchMethod),
        #     IOService::SendIOMessageServicePropertyChange(OSDispatchMethod) and
        #     IOUserClient::CreateActionKernelCompletion(size_t, OSAction**).
        #     The fork's iig-method-forwarders.patch comment ("the kernel build
        #     does not compile the generated .iig.cpp") no longer holds.
        # v3 (current): keep the OSContainer typedef, DELETE the fork's
        #     out-of-line forwarder definitions (exact inverse of its hunk) and
        #     let the iig-generated objects provide all three.
        run: |
          cd UniXNU/out/cepheus/tree
          cp "$GITHUB_WORKSPACE/patches/macos-iig-forwarder-decls.patch" \
             patches/xnu/y00-macos-iig-forwarder-decls.patch
          if [ -d .cache/xnu-work ]; then
            git -C .cache/xnu-work apply --check patches/xnu/y00-macos-iig-forwarder-decls.patch \
              && echo "patch will apply cleanly" \
              || echo "(xnu-work not fetched yet; the build script's patch loop will apply it)"
          else
            echo "(no xnu-work yet; patch loop will apply it)"
          fi

      - name: Inject GITHUB_TOKEN into API scripts
        run: |
          cd UniXNU/out/cepheus/tree
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token present:", bool(token))
          patched = 0
          for f in glob.glob("scripts/*.py"):
              p = Path(f)
              s = p.read_text()
              if "api.github.com" not in s or "_UNIXNU_TOKEN_PATCH" in s:
                  continue
              if "import urllib.request" not in s:
                  continue
              patch = "import urllib.request\n_gh_token = __import__(\"os\").environ.get(\"GITHUB_TOKEN\", \"\")\nif _gh_token:\n    _orig_urlopen = urllib.request.urlopen\n    def _urlopen(url, *a, **kw):\n        req = urllib.request.Request(url) if isinstance(url, str) else url\n        req.add_header(\"Authorization\", \"Bearer \" + _gh_token)\n        req.add_header(\"Accept\", \"application/vnd.github+json\")\n        return _orig_urlopen(req, *a, **kw)\n    urllib.request.urlopen = _urlopen"
              s = s.replace("import urllib.request", patch, 1)
              p.write_text(s)
              patched += 1
              print("patched:", f)
          print("total:", patched)
          PY

      - name: Pre-cache XNU headers to /tmp (no API calls during build)
        run: |
          cd UniXNU/out/cepheus/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          TRUST_TAG="xnu-8796.101.5"
          SHORT=${TAG#xnu-}
          TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          curl -sL --fail -H "Authorization: Bearer ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json"
          echo "=== cached json ==="
          ls -la .cache/sources/
      # The reference checkout has to live outside out/cepheus/tree: unixnu tree rebuilds that
      # directory, and a foreign directory inside it made the build fail with
      #   PermissionError: Operation not permitted: .../tree/refer/IOStorageFamily
      # The audit script resolves ROOT as parents[1] of its own path. Inside the build tree it
      # is linked to out/cepheus/tree/scripts/, so it reads out/cepheus/tree/refer/IOStorageFamily;
      # invoked from the device repository it reads UniXNU/refer/IOStorageFamily. Put a checkout
      # in both places rather than guessing which one runs.
      - name: Fetch IOStorageFamily (public Apple Darwin 23 source)
        run: |
          mkdir -p UniXNU/refer UniXNU/out/cepheus/tree/refer
          for dir in UniXNU/refer/IOStorageFamily UniXNU/out/cepheus/tree/refer/IOStorageFamily; do
            if [ ! -d "$dir/.git" ]; then
              rm -rf "$dir"
              git clone --filter=blob:none https://github.com/apple-oss-distributions/IOStorageFamily.git "$dir"
            fi
            git -C "$dir" checkout -q e45fbe30a7879e0b16e26dddb78538f1b00e0bff
            echo "$dir HEAD: $(git -C "$dir" rev-parse HEAD)"
          done

      # The kernel build is 8 of the 9 minutes. Reusing the object tree turns a full
      # rebuild into an incremental one, which is the only lever available without a macOS
      # host. A new key per commit always saves a fresh cache; restore-keys falls back to
      # the newest previous one so make only recompiles what changed.
      - name: Restore kernel object cache
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/cepheus/tree/.cache/xnu-work/build
          key: xnu-obj-${{ github.sha }}
          restore-keys: |
            xnu-obj-
          # The object tree is large; do not fail the run if the cache is unavailable.
          fail-on-cache-miss: false

      - name: Bootstrap kernel and prelinked candidate
        # The archive builders that bind against the "original candidate"
        # (build-native-legacy-display.py, build-ufs-original-bindings.py) read a prelinked kernel
        # from build/native-prelink. A cold checkout has none, so produce one first: this pass
        # builds a kernel with functions off and then copies it into the candidate names.
        run: |
          cd UniXNU
          # bootstrap configuration: no CONFIG_XNU_BUILD_ARCHIVES, so this pass produces only the
          # compile records and one kernel. Running the archive list here would recurse -- the
          # archives are what need the candidate this pass is creating.
          ./unixnu defconfig cepheus_bootstrap_defconfig -D "$GITHUB_WORKSPACE"
          ./unixnu build kernel -D "$GITHUB_WORKSPACE"
          if [ -f out/cepheus/kernel/kernel.macho ]; then
            mkdir -p out/cepheus/tree/build/native-prelink
            cp out/cepheus/kernel/kernel.macho \
               out/cepheus/tree/build/native-prelink/native-owner-mobile-graphics-candidate.macho
            cp out/cepheus/kernel/kernel.json \
               out/cepheus/tree/build/native-prelink/native-owner-mobile-graphics-candidate.json
            cp out/cepheus/kernel/kernel.macho \
               out/cepheus/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho
            cp out/cepheus/kernel/kernel.json \
               out/cepheus/tree/build/native-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.json
            # Do not leave the bootstrap kernel where the artifact step would pick it up.
            rm -f out/cepheus/kernel/kernel.macho out/cepheus/kernel/kernel.json
            ls -l out/cepheus/tree/build/native-prelink/ || true
          else
            echo 'bootstrap kernel not produced; continuing'
          fi
        continue-on-error: true

      - name: Restore the real configuration
        # The bootstrap pass above selected cepheus_bootstrap_defconfig; put the shipping
        # configuration back before the real build.
        run: |
          cd UniXNU
          ./unixnu defconfig cepheus_defconfig -D "$GITHUB_WORKSPACE"

      - name: Build kernel

        run: |
          cd UniXNU
          # The tree was already assembled (and patched) by the "Assemble tree" step.
          # Re-running `unixnu tree` here applied the patches a second time, failed on
          # the ones that are not idempotent, and the `|| true` hid it -- leaving make to
          # build a half-patched tree. Build the tree that was actually assembled.
          ./unixnu build kernel
          ls -lh out/cepheus/kernel/ || true
        timeout-minutes: 180

      # The documented pipeline is defconfig -> fetch -> tree -> ipsw fetch ->
      # build kernel -> build payload -> bootimg. We were stopping after build kernel and
      # assembling the payload by hand (copying kernel.macho, calling make-cepheus-adt.py,
      # writing unixnu.toml, mcopy-ing a FAT volume). `build payload` does all of that from
      # board.toml: it generates the ADT, writes the config, and lays out the volume at
      # [payload] size_mib with the volume label.
      - name: Install mtools/dosfstools
        if: always()
        run: |
          # unixnu build payload itself needs mformat/mcopy for the FAT volume,
          # so this must run BEFORE "Build payload", not only before the cust
          # image step. brew occasionally exits 1 during its cleanup phase
          # after the bottles are already poured; judge success by the
          # binaries, not the exit code.
          brew install mtools dosfstools || brew install mtools dosfstools
          command -v mcopy
          command -v mkfs.vfat

      - name: Build payload
        if: always()
        run: |
          cd UniXNU
          # No --unique-chip-id here: make-cepheus-adt.py only accepts the pair
          # (--unique-chip-id + --chip-id), and the payload that boots on nabu
          # carries NEITHER -- /chosen identifies the platform via arm-io/product.
          # board.toml [payload] unique_chip_id = false encodes exactly that.
          ./unixnu build payload || true
          echo '--- payload output (recursive) ---'
          find out/cepheus/payload -type f 2>/dev/null | head -40 || true
          # The ADT is not reliably left behind in the stage directory (it was
          # missing in CI round 12), but the FAT payload.img definitely carries
          # it -- list the volume to prove where things ended up.
          if [ -f out/cepheus/payload/payload.img ]; then
            echo '--- payload.img contents ---'
            mdir -i out/cepheus/payload/payload.img -/ ::/ || true
          fi

      # Three-tier ADT sourcing, in order of trust:
      #   1. the stage directory, if `unixnu build payload` left it there
      #   2. mcopy out of payload.img (same file the pipeline just built)
      #   3. regenerate from board.toml defaults (dram-size only; the other
      #      flags match what the pipeline passes for a no-unique-chip-id board)
      # Never let a bare `ls` of a possibly-missing file kill the step again:
      # round 12 died on `ls -lh "$K" "$A"` under bash -e before any fallback ran.
      - name: Build cust payload image
        if: always()
        run: |
          set -x
          K=UniXNU/out/cepheus/kernel/kernel.macho
          P=UniXNU/out/cepheus/payload/payload.img
          S=UniXNU/out/cepheus/payload/stage/EFI/UniXNU/Payloads/kernel.macho.adt
          A=kernel.macho.adt
          if [ -f "$S" ]; then
            cp "$S" "$A"
          elif [ -f "$P" ]; then
            mcopy -n -i "$P" ::/EFI/UniXNU/Payloads/kernel.macho.adt "$A"
          elif [ -f "$K" ]; then
            echo 'WARNING: no stage ADT and no payload.img; regenerating from board defaults'
            python3 scripts/make-cepheus-adt.py --output "$A" --dram-size 0x180000000
          fi
          if [ -f "$K" ] && [ -f "$A" ]; then
            bash scripts/make-cepheus-cust-payload.sh "$K" "$A" cust-payload.img
            ls -lh cust-payload.img
          else
            echo "FAIL: kernel or ADT missing (K=$K A=$A P=$P S=$S)"
            exit 1
          fi

      - name: Verify early checkpoint marks
        if: always()
        run: |
          echo "=== injection records in build logs ==="
          for f in UniXNU/out/cepheus/logs/kernel.log UniXNU/out/cepheus/logs/kernel-bootstrap.log; do
            if [ -f "$f" ]; then
              echo "--- $f"
              grep -a -E 'cepheus pre-clean|marks inserted|WARN: mark' "$f" || echo "    (no mark record)"
            fi
          done
          echo "=== cepheus symbols in the built mach-o ==="
          found=0
          while IFS= read -r k; do
            found=1
            echo "--- $k"
            ls -lh "$k"
            xcrun llvm-nm --defined-only "$k" 2>/dev/null | grep -i cepheus_mark || echo "    (no cepheus_mark symbol)"
          done < <(find UniXNU/out/cepheus/kernel -name '*.macho' 2>/dev/null | head -5)
          [ "$found" = 1 ] || echo "(no mach-o in UniXNU/out/cepheus/kernel)"

      # Stage 6 (storage and root): see the comment above "Assemble tree".
      # Deliberately the LAST build step so a failure here can never skip the
      # kernel chain (round 16). The dmg needs lzfse decompression
      # (udif.py blocks of type 0x80000007); brew's decoder is selected
      # through LZFSE_BIN because udif.py's default /usr/bin path is
      # SIP-protected on macOS.
      - name: Build userdata image
        if: always()
        run: |
          brew install lzfse
          LZ=$(command -v lzfse || ls /opt/homebrew/opt/lzfse/bin/lzfse /usr/local/opt/lzfse/bin/lzfse 2>/dev/null | head -1)
          echo "lzfse decoder: $LZ"
          [ -n "$LZ" ] && [ -x "$LZ" ]
          export LZFSE_BIN="$LZ"
          cd UniXNU
          echo '=== dry run ==='
          ./unixnu build userdata --dry-run || true
          echo '=== real build ==='
          ./unixnu build userdata
          ls -lh out/cepheus/userdata/ 2>/dev/null || true
          cat out/cepheus/userdata/userdata-root.json 2>/dev/null | head -60 || true
        timeout-minutes: 120

      # The raw image is mostly unallocated zeros (the OS/SystemOS disk images
      # carry a few GB of content on a much larger volume), so deflate shrinks
      # it hard; the user extracts it before `fastboot flash userdata`.
      - name: Zip userdata image
        if: always()
        run: |
          if [ -f UniXNU/out/cepheus/userdata/userdata-root.img ]; then
            cd UniXNU/out/cepheus/userdata
            zip -q "$GITHUB_WORKSPACE/userdata-cepheus.zip" userdata-root.img userdata-root.json
            ls -lh "$GITHUB_WORKSPACE/userdata-cepheus.zip"
          else
            echo "no userdata-root.img produced"
          fi

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel.log (real build) ====="
          tail -250 UniXNU/out/cepheus/logs/kernel.log 2>/dev/null || echo "(missing)"
          echo "===== kernel-bootstrap.log (record pass) ====="
          tail -60 UniXNU/out/cepheus/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"
          echo "===== bootstrap errors (full file scan) ====="
          grep -a -nE 'error:|Error [0-9]|\*\*\*|undefined symbol|No such file|cannot find' \
            UniXNU/out/cepheus/logs/kernel-bootstrap.log 2>/dev/null | head -25 || echo "(no error lines)"
          echo "===== overload ambiguity candidates (clang notes) ====="
          grep -a -B2 -A30 "is ambiguous" \
            UniXNU/out/cepheus/logs/kernel-bootstrap.log 2>/dev/null | head -120 || echo "(no ambiguity)"
          echo "===== bootstrap log size / tail of make output ====="
          wc -l UniXNU/out/cepheus/logs/kernel-bootstrap.log 2>/dev/null
          grep -a -nE 'make(\[[0-9]\])?:' UniXNU/out/cepheus/logs/kernel-bootstrap.log 2>/dev/null | tail -10
          echo "===== where LDFILELIST is defined ====="
          cd UniXNU/out/cepheus/tree/.cache/xnu-work 2>/dev/null && \
            grep -rn 'LDFILELIST' --include=Makefile* --include=*.cmd --include=*.def --include=*.top . 2>/dev/null | head -20
          echo "===== bsd filelist inputs present? ====="
          cd "$GITHUB_WORKSPACE/UniXNU/out/cepheus/tree/.cache/xnu-work" 2>/dev/null && {
            ls -la bsd/conf/ 2>/dev/null | head -10
            echo "--- resolved bsd sources ---"
            ls build/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/*.o 2>/dev/null | wc -l
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-cepheus
          path: |
            UniXNU/out/cepheus/kernel/
            UniXNU/out/cepheus/payload/
            UniXNU/out/cepheus/logs/
            cust-payload.img
            kernel.macho.adt
            userdata-cepheus.zip
          if-no-files-found: warn

      # Artifact SAS links expire after ~10 minutes, which makes fetching the
      # 6.7 GiB userdata zip from this side of the wall nearly impossible.
      # Release assets are permanent, range-capable and repo-visible URLs, so
      # publish a rolling release every run. GitHub caps one asset at 2 GiB:
      # split the userdata zip into 1.9 GiB parts; the user concatenates them.
      - name: Publish to release
        if: always()
        env:
          # The job-level GH_TOKEN is the user PAT without release scope; the
          # ephemeral workflow token with contents:write (declared above) can
          # create releases and upload assets.
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cepheus-latest"
          FILES=""
          [ -f cust-payload.img ] && FILES="$FILES cust-payload.img"
          [ -f kernel.macho.adt ] && FILES="$FILES kernel.macho.adt"
          [ -f UniXNU/out/cepheus/kernel/kernel.macho ] && FILES="$FILES UniXNU/out/cepheus/kernel/kernel.macho"
          if [ -f userdata-cepheus.zip ]; then
            split -b 1900m -d userdata-cepheus.zip userdata-cepheus.zip.part-
            FILES="$FILES userdata-cepheus.zip.part-*"
            sha256sum userdata-cepheus.zip > userdata-cepheus.zip.sha256
            FILES="$FILES userdata-cepheus.zip.sha256"
          fi
          [ -n "$FILES" ] || { echo "nothing to publish"; exit 0; }
          gh release create "$TAG" $FILES \
            --title "cepheus bring-up build" \
            --notes "Rolling build. Download userdata-cepheus.zip.part-00..NN, then: cat userdata-cepheus.zip.part-* > userdata-cepheus.zip (verify with the .sha256 file)" \
            || gh release upload "$TAG" $FILES --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size)"'



